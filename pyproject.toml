[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arknights-auto-planner"
version = "0.1.0"
description = "GameData-driven, agent-assisted Arknights strategy planning"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
  "rich>=13,<14",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
api = ["fastapi>=0.111,<1", "uvicorn>=0.30,<1"]
ark = ["httpx>=0.27,<1"]

[project.scripts]
arknights-data = "arknights_planner.cli.data_cli:main"
arknights-plan = "arknights_planner.cli.plan_cli:main"
arknights-exec = "arknights_planner.cli.execution_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "device_integration: explicitly opted-in local Android device experiment",
]

[tool.setuptools.packages.find]
where = ["src"]
